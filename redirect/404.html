<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Aethis...</title>
  <meta name="description" content="Aethis - Professional Guitar Processor & Harmonizer. Redirecting to aethis.agastyajindal.com">
  <link rel="canonical" href="https://aethis.agastyajindal.com/">
  <meta http-equiv="refresh" content="0; url=https://aethis.agastyajindal.com/">
  <script>
    // Preserve the path when redirecting
    const path = window.location.pathname.replace('/aethis', '') || '/';
    const hash = window.location.hash || '';
    const search = window.location.search || '';
    window.location.replace('https://aethis.agastyajindal.com' + path + search + hash);
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      color: #a0a0a0;
      margin-bottom: 1.5rem;
    }
    a {
      color: #D76D77;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Aethis has moved</h1>
    <p>Redirecting you to our new home...</p>
    <p>If you are not redirected automatically, <a href="https://aethis.agastyajindal.com/">click here</a>.</p>
  </div>
</body>
</html>
